;  plg_system_ymmudesocial - en-GB
PLG_SYSTEM_YMMUDESOCIAL="System - YMMUDE Social Login"
PLG_SYSTEM_YMMUDESOCIAL_XML_DESCRIPTION="Adds Google, Apple, Facebook and GitHub login buttons to the login and registration forms. Configure each provider in its own tab. Callback URL for every provider is <code>https://YOURSITE/social-login/{provider}/callback</code>."

PLG_SYSTEM_YMMUDESOCIAL_TAB_GOOGLE="Google"
PLG_SYSTEM_YMMUDESOCIAL_TAB_APPLE="Apple"
PLG_SYSTEM_YMMUDESOCIAL_TAB_FACEBOOK="Facebook"
PLG_SYSTEM_YMMUDESOCIAL_TAB_GITHUB="GitHub"
PLG_SYSTEM_YMMUDESOCIAL_TAB_GENERAL="Accounts"
PLG_SYSTEM_YMMUDESOCIAL_TAB_DISPLAY="Display"

PLG_SYSTEM_YMMUDESOCIAL_ENABLE_LABEL="Enable this provider"
PLG_SYSTEM_YMMUDESOCIAL_CALLBACK_LABEL="Redirect / Callback URL"

PLG_SYSTEM_YMMUDESOCIAL_GOOGLE_NOTE="Register this <b>Authorized redirect URI</b> in Google Cloud Console → APIs &amp; Services → Credentials → your OAuth 2.0 Client ID:<br><code>https://whymuddy.com/social-login/google/callback</code>"
PLG_SYSTEM_YMMUDESOCIAL_GOOGLE_CLIENT_ID="Client ID"
PLG_SYSTEM_YMMUDESOCIAL_GOOGLE_CLIENT_ID_DESC="Ends with .apps.googleusercontent.com"
PLG_SYSTEM_YMMUDESOCIAL_GOOGLE_CLIENT_SECRET="Client Secret"
PLG_SYSTEM_YMMUDESOCIAL_GOOGLE_CLIENT_SECRET_DESC="Starts with GOCSPX-"

PLG_SYSTEM_YMMUDESOCIAL_APPLE_NOTE="Register this <b>Return URL</b> on your Services ID in Apple Developer → Certificates, Identifiers &amp; Profiles → Identifiers → Services IDs → Sign in with Apple → Configure:<br><code>https://whymuddy.com/social-login/apple/callback</code><br>Domain: <code>whymuddy.com</code>"
PLG_SYSTEM_YMMUDESOCIAL_APPLE_CLIENT_ID="Services ID (Client ID)"
PLG_SYSTEM_YMMUDESOCIAL_APPLE_CLIENT_ID_DESC="The reverse-domain identifier of your Services ID, e.g. com.ymmude.web"
PLG_SYSTEM_YMMUDESOCIAL_APPLE_TEAM_ID="Team ID"
PLG_SYSTEM_YMMUDESOCIAL_APPLE_TEAM_ID_DESC="10-character Team ID shown top-right in Apple Developer account / Membership."
PLG_SYSTEM_YMMUDESOCIAL_APPLE_KEY_ID="Key ID"
PLG_SYSTEM_YMMUDESOCIAL_APPLE_KEY_ID_DESC="10-character Key ID of the Sign in with Apple key you created under Keys."
PLG_SYSTEM_YMMUDESOCIAL_APPLE_PRIVATE_KEY="Private Key (.p8 contents)"
PLG_SYSTEM_YMMUDESOCIAL_APPLE_PRIVATE_KEY_DESC="Paste the entire contents of the downloaded AuthKey_XXXXXXXXXX.p8 file, including the BEGIN/END PRIVATE KEY lines."

PLG_SYSTEM_YMMUDESOCIAL_FACEBOOK_NOTE="Register this <b>Valid OAuth Redirect URI</b> in Meta for Developers → your App → Facebook Login → Settings:<br><code>https://whymuddy.com/social-login/facebook/callback</code>"
PLG_SYSTEM_YMMUDESOCIAL_FACEBOOK_APP_ID="App ID"
PLG_SYSTEM_YMMUDESOCIAL_FACEBOOK_APP_ID_DESC="Numeric App ID from Meta App Dashboard → App settings → Basic."
PLG_SYSTEM_YMMUDESOCIAL_FACEBOOK_APP_SECRET="App Secret"
PLG_SYSTEM_YMMUDESOCIAL_FACEBOOK_APP_SECRET_DESC="App Secret from Meta App Dashboard → App settings → Basic (click Show)."

PLG_SYSTEM_YMMUDESOCIAL_GITHUB_NOTE="Register this <b>Authorization callback URL</b> in GitHub → Settings → Developer settings → OAuth Apps → your app:<br><code>https://whymuddy.com/social-login/github/callback</code>"
PLG_SYSTEM_YMMUDESOCIAL_GITHUB_CLIENT_ID="Client ID"
PLG_SYSTEM_YMMUDESOCIAL_GITHUB_CLIENT_ID_DESC="Client ID shown on the OAuth App page."
PLG_SYSTEM_YMMUDESOCIAL_GITHUB_CLIENT_SECRET="Client Secret"
PLG_SYSTEM_YMMUDESOCIAL_GITHUB_CLIENT_SECRET_DESC="Generate a new client secret on the OAuth App page and paste it here."

PLG_SYSTEM_YMMUDESOCIAL_ALLOW_CREATION="Create new accounts"
PLG_SYSTEM_YMMUDESOCIAL_ALLOW_CREATION_DESC="If Yes, a visitor with no matching account is registered automatically (no activation email needed). If No, only existing users can sign in with a social account."
PLG_SYSTEM_YMMUDESOCIAL_DEFAULT_GROUP="Default user group"
PLG_SYSTEM_YMMUDESOCIAL_DEFAULT_GROUP_DESC="Group assigned to accounts created via social login."
PLG_SYSTEM_YMMUDESOCIAL_AUTO_ACTIVATE="Auto-activate pending accounts"
PLG_SYSTEM_YMMUDESOCIAL_AUTO_ACTIVATE_DESC="If a user registered normally but never clicked the activation email, signing in with a provider that verified the same email activates the account."
PLG_SYSTEM_YMMUDESOCIAL_LINK_UNVERIFIED="Link by unverified email"
PLG_SYSTEM_YMMUDESOCIAL_LINK_UNVERIFIED_DESC="Allow linking to an existing account when the provider did not confirm the email is verified. Recommended: No (security)."
PLG_SYSTEM_YMMUDESOCIAL_REMEMBER="Remember me"
PLG_SYSTEM_YMMUDESOCIAL_REMEMBER_DESC="Set the Remember Me cookie after social login."
PLG_SYSTEM_YMMUDESOCIAL_REDIRECT="Redirect after login"
PLG_SYSTEM_YMMUDESOCIAL_REDIRECT_DESC="Internal path (e.g. /my-music) or index.php?option=... URL. Leave empty to return to the page the user came from, or the profile page."

PLG_SYSTEM_YMMUDESOCIAL_HEADING="Heading text"
PLG_SYSTEM_YMMUDESOCIAL_HEADING_DESC="Separator text shown above the buttons. Leave empty to hide."
PLG_SYSTEM_YMMUDESOCIAL_BUTTON_TEXT="Button text"
PLG_SYSTEM_YMMUDESOCIAL_BUTTON_TEXT_DESC="%s is replaced by the provider name."
PLG_SYSTEM_YMMUDESOCIAL_MODULE_TARGET="Login module selector"
PLG_SYSTEM_YMMUDESOCIAL_MODULE_TARGET_DESC="CSS selector inside mod_login; buttons are inserted before it. Empty = do not inject."
PLG_SYSTEM_YMMUDESOCIAL_COMPONENT_TARGET="Login page selector"
PLG_SYSTEM_YMMUDESOCIAL_COMPONENT_TARGET_DESC="CSS selector on the com_users login page; buttons are inserted before it. Empty = do not inject."
PLG_SYSTEM_YMMUDESOCIAL_REGISTRATION_TARGET="Registration page selector"
PLG_SYSTEM_YMMUDESOCIAL_REGISTRATION_TARGET_DESC="CSS selector on the com_users registration page; buttons are inserted before it. Empty = do not inject."
PLG_SYSTEM_YMMUDESOCIAL_SHORTCODE="Shortcode"
PLG_SYSTEM_YMMUDESOCIAL_SHORTCODE_DESC="Place <code>{ymmude_social_login}</code> in any article or custom module to render the buttons there."
